name: Release Pipeline

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'microsoft/ts-gyb'
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.package.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 22.15.1
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2.5.2
        with:
          node-version: 22.15.1
      - name: Verify release source
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash .github/scripts/verify-release.sh
      - name: Check out verified release commit
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
      - name: match-tag-to-package-version
        uses: geritol/match-tag-to-package-version@c653bdd54d55b1576705a162417957903cd5851e # 0.0.2
        env:
          TAG_PREFIX: refs/tags/v
      - run: npm ci
      - run: npm run build
      - name: Pack without lifecycle scripts
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          filename=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package")
          mv "$RUNNER_TEMP/npm-package/$filename" "$RUNNER_TEMP/npm-package/package.tgz"
      - name: Upload release package
        id: package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/package.tgz
          if-no-files-found: error

  npm-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js 22.15.1
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2.5.2
        with:
          node-version: 22.15.1
          registry-url: https://registry.npmjs.org
      - name: Require an immutable package artifact
        env:
          PACKAGE_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: |
          if [[ ! "$PACKAGE_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The verified build must provide a package artifact ID."
            exit 1
          fi
      - name: Download verified release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/npm-package
          merge-multiple: true
      - name: Publish without lifecycle scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Configure NPM_TOKEN in the repository's Actions secrets."
            exit 1
          fi
          npm publish --ignore-scripts "$RUNNER_TEMP/npm-package/package.tgz"
